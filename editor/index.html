<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%238b5cf6'/%3E%3C/svg%3E" />
    <title>fogya.tech / editor</title>
  </head>
  <body>
    <header class="bar">
      <div class="bar-title"><strong>fogya.tech</strong><span>/ editor</span></div>

      <!-- The ribbon: groups of tools with a name under each, as in PowerPoint. -->
      <div class="ribbon" role="toolbar" aria-label="Editor tools">
        <section class="rgroup" aria-label="Insert">
          <div class="rtools">
            <button class="btn" id="add-text" type="button">Text</button>
            <button class="btn" id="add-heading" type="button">Heading</button>
            <button class="btn" id="add-image" type="button" aria-haspopup="dialog">Image</button>
            <button class="btn" id="add-pdf" type="button" aria-haspopup="dialog">PDF</button>
            <button class="btn" id="add-rect" type="button">Rectangle</button>
            <button class="btn" id="add-code" type="button">Code</button>
          </div>
          <span class="rlabel">Insert</span>
        </section>

        <section class="rgroup" aria-label="Text">
          <div class="rtools">
            <select id="r-font" class="r-font" aria-label="Font" title="Font"><option value="">Font</option></select>
            <input id="r-size" class="r-size" type="number" min="8" max="600" aria-label="Text size in px" title="Text size (px)" />
            <span class="seg">
              <button class="btn" id="r-bullets" type="button" title="Bullets (Ctrl+Shift+8)" aria-label="Bullets">•</button>
              <button class="btn" id="r-numbers" type="button" title="Numbers (Ctrl+Shift+7)" aria-label="Numbers">1.</button>
            </span>
            <span class="seg">
              <button class="btn" id="r-left" type="button" title="Align left">L</button>
              <button class="btn" id="r-center" type="button" title="Align centre">C</button>
              <button class="btn" id="r-right" type="button" title="Align right">R</button>
            </span>
          </div>
          <span class="rlabel">Text</span>
        </section>

        <section class="rgroup" aria-label="Arrange">
          <div class="rtools">
            <button class="btn" id="front" type="button">To front</button>
            <button class="btn" id="back" type="button">To back</button>
            <button class="btn" id="snap" type="button" aria-pressed="true" title="Snap to edges, centres and margins while dragging. Hold Alt to switch it off for one drag.">Snap on</button>
          </div>
          <span class="rlabel">Arrange</span>
        </section>

        <section class="rgroup" aria-label="Edit">
          <div class="rtools">
            <button class="btn" id="undo" type="button" title="Ctrl+Z">Undo</button>
            <button class="btn" id="redo" type="button" title="Ctrl+Y">Redo</button>
            <button class="btn" id="copy" type="button" title="Copy the selected element (Ctrl+C). Ctrl+X cuts.">Copy</button>
            <button class="btn" id="paste" type="button" title="Paste onto this slide (Ctrl+V)">Paste</button>
            <button class="btn" id="del" type="button" title="Delete">Delete</button>
          </div>
          <span class="rlabel">Edit</span>
        </section>

        <section class="rgroup" aria-label="Slide">
          <div class="rtools">
            <select id="r-transition" class="r-transition" aria-label="Slide transition" title="How this slide appears"></select>
          </div>
          <span class="rlabel">Transition</span>
        </section>
      </div>

      <div class="bar-actions">
        <span class="status" id="status" role="status"></span>
        <a class="btn btn-primary" id="present" href="/" target="_blank" rel="noopener">Present</a>
      </div>
    </header>

    <main class="panes">
      <aside class="pane pane-list">
        <div class="pane-head">Slides <span id="count"></span></div>
        <ol class="slide-list" id="list"></ol>
        <form class="new-slide" id="new-form" autocomplete="off">
          <label for="new-name">New slide after the selected one</label>
          <input id="new-name" name="name" type="text" placeholder="name, e.g. results" spellcheck="false" />
          <button class="btn" type="submit">Add blank slide</button>
          <p class="hint">To reuse a layout, duplicate its slide with the D button.</p>
        </form>
      </aside>

      <section class="pane pane-stage">
        <div class="pane-head"><span id="current-file"></span><span id="stage-hint">Click to select. Double-click to type. Drag to move.</span></div>
        <div class="stage-wrap">
          <iframe id="stage" title="Slide" src="/?edit"></iframe>
          <div class="image-panel" id="image-panel" role="dialog" aria-label="Images" hidden>
            <div class="image-panel-head">
              <strong id="image-panel-title">Add image</strong>
              <button class="btn" id="image-upload" type="button">Upload from computer</button>
              <button class="btn" id="image-close" type="button">Close</button>
            </div>
            <div class="image-grid" id="image-grid"></div>
            <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif,image/svg+xml" hidden />
          </div>
        </div>
      </section>

      <aside class="pane pane-side">
        <div class="tabs" role="tablist">
          <button class="tab is-active" id="tab-design" type="button" role="tab">Design</button>
          <button class="tab" id="tab-code" type="button" role="tab">Code</button>
        </div>
        <div class="inspector" id="inspector"></div>
        <div class="code" id="code" hidden></div>
      </aside>
    </main>

    <script type="module" src="/src/editor/editor.js"></script>
  </body>
</html>
